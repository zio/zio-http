name: Deploy Website
on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:  # Manual deploy: Actions > Deploy Website > Run workflow, on main

# Netlify builds the site when this workflow calls its build hook (NETLIFY_DEPLOY_WEBHOOK). Netlify no longer builds on
# every push to main (see netlify.toml, build.ignore). Pull requests run the same build as a check, without deploying.
permissions: {}

jobs:
  build:
    name: Build website (check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Pull requests always get a build check. A manual run is refused unless it targets main.
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
      - name: Run build script
        run: ./build.sh
        shell: bash

  deploy:
    name: Trigger Netlify deploy
    # Only a release or a manual run on main reaches production. Pull requests stop after the build check.
    if: ${{ (github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    # One production deploy at a time. A running deploy is never cancelled half-way through.
    concurrency:
      group: deploy-website
      cancel-in-progress: false
    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_DEPLOY_WEBHOOK: ${{ secrets.NETLIFY_DEPLOY_WEBHOOK }}
        run: |
          curl -fsS -X POST -d {} "$NETLIFY_DEPLOY_WEBHOOK"
          echo "Netlify build triggered for ${{ github.ref_name }} ${{ github.sha }}."
