# Netlify does not build the site. The "Deploy Website" workflow (.github/workflows/site.yml) builds it in GitHub Actions
# and uploads the finished files. The ignore command skips every Git-triggered Netlify build (pushes to main and pull
# requests), since exit code 0 cancels the build.
[build]
  command = "./build.sh"
  publish = "website/build"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24.22.1"
  YARN_VERSION = "1.22.22"
